# PLACEHOLDER DATA. Not any installer's real catalog.
#
# Datasheet values for panels and inverters, and their unit prices, taken from the research note
# docs/research/placeholder-market-data.md (sections 2.1-2.3, research date 2026-11-24).
# Each item names the datasheet it comes from and that datasheet's date. Unit prices are USD,
# delivered to a Turkish installer; they are estimates (no price list was reachable), and each
# carries its own price_source and price_date.
# Replace this file with the installer's real catalog and price list when they arrive.

# The panel used for every System Option.
default_panel = "trina-vertex-s-plus-neg9rh25-440"

[meta]
placeholder = true
description = "Placeholder panel catalog compiled from public manufacturer datasheets."

[[panels]]
panel_id = "trina-vertex-s-plus-neg9rh25-440"
manufacturer = "Trina Solar"
model = "Vertex S+ TSM-NEG9RH.25 (440 W)"
power_w = 440
length_mm = 1762
width_mm = 1134
# Constant annual rate (share of year-1 output lost per year). Derived: the datasheet guarantees
# 1% in year 1 then 0.40%/yr, which is 89.4% at year 25; the constant rate that reaches 89.4%
# in 24 steps is 1 - 0.894^(1/24) = 0.47%. A guarantee (worst case), not a typical field value.
degradation_rate_per_year = 0.0047
unit_price_usd = 76
price_kind = "estimate"
price_source = "docs/research/placeholder-market-data.md section 2.3: USD 0.17/W x 440 W, between the InfoLink TOPCon and all-black spot prices (https://www.infolink-group.com/energy-article/pv-spot-price-20261118) plus a freight/customs/distributor uplift"
price_date = 2026-11-24
source = "https://www-cdn.trinasolar.com/wwwstorage/sites/17/DT-M-0130-NA-EN-A-Datasheet_Vertex-S_NEG9RH.25_2026_A.pdf"
source_date = 2026-05-27
kind = "direct"
notes = "Full black, dual glass, 30-year power guarantee. Degradation rate is derived (see above). Source date is when the PDF was saved."

