name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sunquote
          POSTGRES_PASSWORD: sunquote
          POSTGRES_DB: sunquote
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sunquote -d sunquote"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # The repository tests run against this service. In CI an unreachable database fails them.
      SUNQUOTE_TEST_DATABASE_URL: postgresql+asyncpg://sunquote:sunquote@localhost:5432/sunquote
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest
