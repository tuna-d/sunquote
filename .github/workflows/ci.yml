name: CI

on:
  push:
  pull_request:

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan Git history with Gitleaks
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks

          report="$RUNNER_TEMP/gitleaks.json"
          scan_status=0
          "$RUNNER_TEMP/gitleaks" git --log-opts="--all --full-history --diff-merges=first-parent" \
            --redact=100 --no-banner --report-format json --report-path "$report" || scan_status=$?
          if [ -s "$report" ]; then
            jq -c '.[] | {file: .File, commit: .Commit, kind: .RuleID}' "$report"
          fi
          exit "$scan_status"

  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sunquote
          POSTGRES_PASSWORD: sunquote
          POSTGRES_DB: sunquote
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sunquote -d sunquote"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      SUNQUOTE_TEST_DATABASE_URL: postgresql+asyncpg://sunquote:sunquote@localhost:5432/sunquote
      SUNQUOTE_TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: uv sync
        working-directory: .
      - run: npm ci
      # Regenerate the OpenAPI schema and the TypeScript types from the API; a diff means the
      # committed files are stale. Fix with `cd web && npm run api:sync` and commit.
      - name: OpenAPI drift
        run: |
          npm run api:sync
          git diff --exit-code -- openapi.json src/api/schema.d.ts
          untracked="$(git ls-files --others --exclude-standard -- openapi.json src/api/schema.d.ts)"
          test -z "$untracked"
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The smoke test (#45): the real web app against a mocked API (web/e2e/mock-api.mjs).
      - name: Install the Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Smoke test
        run: npm run e2e
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: web/test-results
          if-no-files-found: ignore
