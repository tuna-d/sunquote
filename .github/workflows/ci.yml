name: CI

on:
  push:
  pull_request:

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan Git history with Gitleaks
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks

          report="$RUNNER_TEMP/gitleaks.json"
          scan_status=0
          "$RUNNER_TEMP/gitleaks" git --log-opts="--all --full-history --diff-merges=first-parent" \
            --redact=100 --no-banner --report-format json --report-path "$report" || scan_status=$?
          if [ -s "$report" ]; then
            jq -c '.[] | {file: .File, commit: .Commit, kind: .RuleID}' "$report"
          fi
          exit "$scan_status"

  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sunquote
          POSTGRES_PASSWORD: sunquote
          POSTGRES_DB: sunquote
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sunquote -d sunquote"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      SUNQUOTE_TEST_DATABASE_URL: postgresql+asyncpg://sunquote:sunquote@localhost:5432/sunquote
      SUNQUOTE_TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest
