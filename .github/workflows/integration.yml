name: Integration tests

# Talks to real external services (PVGIS today; Nominatim and TCMB join later), so it never
# runs on push or pull request. Start it by hand from the Actions tab.
on:
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run pytest -m integration
