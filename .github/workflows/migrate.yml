name: Migrate production database

# Production is migrated here, not by the API at startup (SUNQUOTE_MIGRATE_ON_STARTUP is off on
# Vercel). Needs the repository secret SUNQUOTE_DATABASE_URL: Neon's connection string. Without
# it the job skips with a notice, so a fork or a fresh clone stays green.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Two migrations never run side by side; a newer push waits for the running one.
concurrency:
  group: migrate-production
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUNQUOTE_DATABASE_URL: ${{ secrets.SUNQUOTE_DATABASE_URL }}
    steps:
      - name: Check for the database secret
        id: secret
        run: |
          if [ -z "$SUNQUOTE_DATABASE_URL" ]; then
            echo "::notice title=Migration skipped::The repository secret SUNQUOTE_DATABASE_URL is not set."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.secret.outputs.present == 'true'
      - uses: astral-sh/setup-uv@v6
        if: steps.secret.outputs.present == 'true'
        with:
          enable-cache: true
      - name: Apply the migrations (alembic upgrade head)
        if: steps.secret.outputs.present == 'true'
        run: uv run --no-dev python -m sunquote.adapters.postgres.migrate
